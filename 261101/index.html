<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="사도행전 6:1-7, 중고등부 선택형 스토리 게임">
<title>성령과 지혜가 충만한 리더 | 말씀 이야기</title>
<style>
  :root{
    --bg1:#140f2e; --bg2:#271a4d; --bg3:#3d2470;
    --gold:#f6c453; --gold-dark:#d9a62e;
    --card:rgba(255,255,255,0.07); --card-border:rgba(255,255,255,0.14);
    --text:#f5f3ff; --muted:#b7aede;
    --ok:#4ade80; --bad:#f87171; --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 15%, rgba(246,196,83,0.14), transparent 40%),
      radial-gradient(circle at 85% 8%, rgba(255,255,255,0.08), transparent 35%),
      radial-gradient(circle at 70% 85%, rgba(246,196,83,0.08), transparent 40%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    color:var(--text); min-height:100vh; overflow-x:hidden;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
    padding: calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));}

  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .brand{font-size:12.5px; font-weight:800; color:var(--gold); letter-spacing:.2px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tools{display:flex; gap:7px; flex-shrink:0;}
  .tool-btn{min-width:40px; min-height:38px; border-radius:10px; border:1px solid var(--card-border); background:var(--card); color:var(--text); font-size:12.5px; padding:0 10px; display:flex; align-items:center; justify-content:center; gap:4px;}

  .meta-row{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted); margin-bottom:6px;}
  #progress-wrap{height:9px; background:rgba(255,255,255,0.1); border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,0.12); margin-bottom:16px;}
  #progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--gold-dark),var(--gold)); border-radius:20px; transition:width .5s ease;}

  .screen{display:none; flex:1; flex-direction:column; animation:fadeIn .4s ease;}
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important; transition:none!important;} }

  .card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px; margin-bottom:14px; backdrop-filter:blur(6px);}
  h1{font-size:clamp(21px,6vw,27px); margin:.2em 0; line-height:1.35;}
  h2{font-size:clamp(17.5px,5vw,20.5px); margin:.2em 0 10px; line-height:1.4;}
  p{line-height:1.65; color:var(--text); font-size:15px; margin:0 0 10px;}
  .muted{color:var(--muted); font-size:13.5px;}
  .center{text-align:center;}
  .badge{display:inline-block; background:rgba(246,196,83,0.15); color:var(--gold); border:1px solid rgba(246,196,83,0.4); border-radius:20px; padding:4px 12px; font-size:12.5px; margin-bottom:10px;}

  .btn{display:block; width:100%; padding:15px; border-radius:14px; border:none; background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:#2a1b00; font-weight:700; font-size:16px; cursor:pointer; margin-top:10px; box-shadow:0 6px 16px rgba(246,196,83,0.25);}
  .btn:active{transform:scale(.98);}
  .btn[disabled]{opacity:.6;}
  .btn.secondary{background:transparent; border:1px solid var(--card-border); color:var(--text); box-shadow:none;}
  .btn.outline{background:rgba(255,255,255,0.05); border:1px solid var(--card-border); color:var(--text); box-shadow:none; font-weight:700;}

  /* scene art */
  .scene-art{position:relative; height:clamp(120px,27vw,170px); border:1px solid var(--card-border); border-radius:18px; margin-bottom:14px; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .scene-art .emoji{font-size:clamp(44px,13vw,62px); filter:drop-shadow(0 8px 10px rgba(0,0,0,.35)); animation:float 3.2s ease-in-out infinite;}
  .scene-art .tag{position:absolute; top:10px; left:12px; font-size:11px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.3); padding:3px 10px; border-radius:20px; font-weight:700;}
  @keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  .theme-0{background:linear-gradient(160deg,#4b2f73,#241440);}
  .theme-1{background:linear-gradient(160deg,#5b3a86,#2c1854);}
  .theme-2{background:linear-gradient(160deg,#1f4f7a,#122840);}
  .theme-3{background:linear-gradient(160deg,#8a6a1f,#3d2d0d);}
  .theme-4{background:linear-gradient(160deg,#4a5568,#1f2733);}

  .room-tag{font-size:13px; color:var(--gold); font-weight:700; margin-bottom:6px;}
  .story{font-style:italic; color:var(--muted); font-size:14px; margin-bottom:14px; line-height:1.7;}

  .option{display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px; border-radius:14px; border:1px solid var(--card-border); background:rgba(255,255,255,0.04); color:var(--text); font-size:14.5px; line-height:1.55; cursor:pointer;}
  .option:active{transform:scale(.985);}
  .option.correct{border-color:var(--ok); background:rgba(74,222,128,0.15);}
  .option.wrong{border-color:var(--bad); background:rgba(248,113,113,0.15); animation:shake .35s;}
  .option[disabled]{opacity:.55;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  .feedback{border-radius:14px; padding:14px 16px; margin-top:4px; font-size:14px; line-height:1.65; display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:rgba(74,222,128,0.12); border:1px solid rgba(74,222,128,0.4);}
  .feedback.hint{background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.4);}
  .feedback b{color:var(--gold);}

  .keys{display:flex; gap:8px; margin:4px 0 0; flex-wrap:wrap; justify-content:center;}
  .key{width:38px;height:38px; border-radius:10px; display:flex;align-items:center;justify-content:center; font-size:17px; border:1px solid var(--card-border); background:rgba(255,255,255,0.03); transition:all .3s;}
  .key.got{background:rgba(246,196,83,0.2); border-color:var(--gold); transform:scale(1.08);}

  textarea, input[type=text]{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--card-border); background:rgba(255,255,255,0.06); color:var(--text); font-size:14.5px; font-family:inherit; margin-bottom:10px;}
  textarea::placeholder, input::placeholder{color:var(--muted);}
  textarea{resize:none; min-height:72px;}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:700;}

  .verse-box{border-left:3px solid var(--gold); padding:14px 16px; margin:4px 0 0; background:rgba(246,196,83,0.07); border-radius:0 12px 12px 0; font-size:14.5px; line-height:1.85; color:var(--text);}
  .verse-num{color:var(--gold); font-weight:800; margin-right:4px;}

  .action-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px;}
  .status-line{text-align:center; font-size:13px; color:var(--aqua,#8ae7d9); min-height:18px; margin-top:10px;}

  footer.note{text-align:center; font-size:12px; color:var(--muted); margin-top:auto; padding-top:16px;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">✦ 수인중앙교회 · 말씀 이야기</div>
    <div class="tools">
      <button class="tool-btn" id="sound-btn" type="button" aria-pressed="false">🔇</button>
      <button class="tool-btn" id="restart-btn" type="button">↻ 처음</button>
    </div>
  </header>

  <div class="meta-row"><span id="progress-label">장면 1 / 4</span><span id="progress-count">0 / 4</span></div>
  <div id="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><div id="progress-bar"></div></div>

  <!-- SCENE (reused for 4 scenes) : 링크를 열면 바로 1장이 시작됩니다 -->
  <section class="screen active" id="screen-puzzle">
    <div class="scene-art" id="room-art"><span class="tag" id="room-stage"></span><span class="emoji" id="room-emoji"></span></div>
    <div class="card">
      <div class="room-tag" id="room-tag"></div>
      <div class="story" id="room-story"></div>
      <h2 id="room-q"></h2>
      <div id="room-options"></div>
      <div class="feedback" id="room-feedback" aria-live="polite"></div>
      <button class="btn" id="btn-next" style="display:none;">다음 장면으로 →</button>
    </div>
    <div class="keys" id="keys-row"></div>
  </section>

  <!-- FINAL -->
  <section class="screen" id="screen-final">
    <div class="scene-art theme-0"><span class="tag">STORY COMPLETE</span><span class="emoji">🎉</span></div>
    <div class="card center">
      <div class="badge">이야기 완성 · 4 / 4</div>
      <h1>이야기가 완성됐어!</h1>
    </div>
    <div class="card">
      <div class="verse-box" id="verse-box"></div>
    </div>
    <div class="card">
      <h2>💌 선생님께 전하기</h2>
      <p class="muted" style="margin-bottom:12px;">아래에 적고 제출하면 바로 전달돼요. 심방이나 안부 연락을 받을 수 있어!</p>
      <label for="final-name">이름 <span style="color:var(--bad);">*필수</span></label>
      <input type="text" id="final-name" placeholder="이름을 입력해줘">
      <label for="final-note">오늘 말씀 중 나누고 싶은 것 · 기도제목</label>
      <textarea id="final-note" placeholder="예: 우리 중고등부 임원들을 위해 기도하고 싶어요"></textarea>
      <div class="action-row">
        <button class="btn" id="btn-share" style="margin-top:0;">📤 선생님께 보내기</button>
      </div>
      <div class="status-line" id="status-line"></div>
    </div>
    <div class="card">
      <h2>🙏 목사님께 하고 싶은 말 · 기도제목 <span class="muted" style="font-weight:400;font-size:12px;">(선택)</span></h2>
      <p class="muted" style="margin-bottom:12px;">개인적으로 하고 싶은 말이나 기도제목이 있으면 적어줘. 제출하면 바로 목사님께 전달돼요! (위의 이름 칸에 이름을 적어줘)</p>
      <textarea id="pastor-note" placeholder="예: 목사님, 오늘 설교 듣고 이런 생각이 들었어요... / 요즘 이런 기도제목이 있어요..."></textarea>
      <div class="action-row">
        <button class="btn outline" id="btn-pastor-send" style="margin-top:0;">📨 목사님께 보내기</button>
      </div>
      <div class="status-line" id="pastor-status"></div>
    </div>
    <footer class="note">수인중앙교회 중고등부 · 261101 설교 기반 선택형 스토리 게임</footer>
  </section>

</div>

<script>

  "use strict";

  // ============================================================

    '<div style="margin-top:10px;"><span class="verse-num">2</span>열두 사도가 모든 제자를 불러 이르되 우리가 하나님의 말씀을 제쳐 놓고 접대를 일삼는 것이 마땅하지 아니하니</div>' +

    '<div style="margin-top:10px;"><span class="verse-num">5</span>온 무리가 이 말을 기뻐하여 믿음과 성령이 충만한 사람 스데반과 또 빌립과 브로고로와 니가노르와 디몬과 바메나와 유대교에 입교했던 안디옥 사람 니골라를 택하여</div>' +

  var FORM_ENTRY = {
    name: "entry.1626522824",      // 이름
    from: "entry.1380117152",      // 보낸사람 구분 (선생님 / 목사님)

  // 선택지의 r = 그 선택을 했을 때 이야기 속에서 일어난 일(오답일 때만 표시)

    {
      room: "1장 · 예루살렘 교회의 아침",
      theme: 3, emoji: "🌅",
      story: "예수님이 승천하신 뒤, 성령님과 함께하는 예루살렘 교회에는 사랑이 넘치고 날마다 사람들이 늘어난다. 너도 그 교회의 성도 중 한 명이다. 그런데 오늘 아침, 매일 나누는 구제에서 빠진 과부들이 있다는 소식이 퍼진다. 광장에서 사람들이 웅성거린다. “우리는 유대인이 아니라서 차별하는 거 아니야?”",
      q: "너라면 지금 어떻게 하겠어?",
      options: [
        {t:"“교회가 일부러 차별하는 거야!” 하며 불만 있는 사람들과 따로 모여 이야기한다", ok:false, r:"불평하는 목소리가 점점 커지고, 교회 안에 편이 갈라지기 시작한다."},

      room: "3장 · 일곱 사람을 뽑는 날",
      theme: 1, emoji: "🗳️",
      story: "이제 성도들이 일곱 사람을 뽑을 차례다. 광장에 후보들이 모였다. 말솜씨가 뛰어난 사람, 재산이 많은 사람, 나와 가장 친한 친구, 그리고 조용히 사람들을 섬겨 온 사람이 있다. 이제 너의 한 표를 던질 차례다.",
      q: "너의 한 표는 누구에게 갈까?",
      options: [
        {t:"말을 제일 잘하고 인기가 많아서, 우리 이야기를 잘 들어줄 것 같은 사람", ok:false, r:"인기는 많지만, 정작 꼭 필요한 섬김은 뒤로 밀리고 만다."},
        {t:"재산이 많아서 교회에 큰 도움이 될 것 같은 사람", ok:false, r:"도움은 되겠지만, 믿음으로 섬기는 마음까지 있는지는 알 수 없다."},
        {t:"나와 가장 친해서 나를 편하게 해 줄 것 같은 사람", ok:false, r:"나에게는 편하겠지만, 공동체 전체를 섬길 사람인지는 알 수 없다."},
        {t:"믿음과 성령이 충만해서, 함께 예수님을 잘 믿도록 섬길 것이라고 칭찬받는 사람", ok:true}
      ],
      hint: "3절의 기준을 떠올려 봐. “성령과 ___가 충만하여 칭찬 받는 사람.” 5절에서는 “믿음과 성령이 충만한 사람”이라고 했어.",
      explain: "교회 리더의 기준은 인기도, 재산도, 친한 정도도, 나의 이익도 아니야. 믿음과 성령이 충만해서 함께 예수님을 잘 믿도록 섬길 사람이어야 해. 이런 사람들이 세워지자 하나님의 말씀이 점점 왕성해지고 제자의 수가 많아졌어. (행 6:3-7)"
    },
    {
      room: "4장 · 오늘, 우리 학생 총회",
      theme: 4, emoji: "📋",
      story: "이야기에서 빠져나와 오늘의 너로 돌아온다. 이번 주일 공과 시간에는 학생 총회가 있다. 한 해 동안 중고등부가 어떻게 운영되어 왔는지 돌아보고, 내년에 중고등부를 섬길 임원을 뽑는 시간이다. 투표용지를 받은 너는 오늘 말씀을 떠올려 본다.",
      q: "오늘 말씀에 비추어, 투표하는 나와 뽑힌 임원이 가져야 할 태도는?",
      options: [
        {t:"나 대신 열심히 일해 줄 사람을 뽑고, 뽑은 뒤에는 임원들이 알아서 잘하겠지 하고 맡겨 둔다. 뽑힌 임원은 맡은 일만 해내면 충분하다", ok:false, r:"임원들만 지치고, 중고등부는 함께 자라지 못한다."},
        {t:"나와 함께 예수님을 잘 믿도록 섬길 사람을 뽑고, 뽑은 뒤에도 협조하며 기도한다. 뽑힌 임원은 하나님이 세우셨다는 마음으로 하나님을 알기에 힘쓴다", ok:true},
        {t:"세상 선거처럼 우리 반이나 친한 친구들에게 이익이 될 사람을 뽑고, 뽑힌 임원은 그 기대에 맞추려고 애쓴다", ok:false, r:"공동체가 편으로 나뉘고, 예수님을 따르는 일은 뒷전이 된다."},
        {t:"투표할 때는 인기 있는 사람을 뽑고, 뽑힌 임원은 높은 자리에 올랐으니 친구들이 잘 따라 주길 기대한다", ok:false, r:"섬김이 아니라 자리가 목적이 되어 버린다."}
      ],
      hint: "설교에서 “오늘 투표하는 사람들은 나 ___ 일해 줄 사람을 뽑는 게 아니라, 나와 ___ 예수님을 잘 믿도록 섬길 수 있는 사람을 뽑는 시간”이라고 했어.",
      explain: "투표는 누가 나를 편하게 해 줄지 고르는 일이 아니야. 함께 예수님을 믿고 섬길 사람을 세우는 일이지. 뽑은 뒤에도 서로 협조하고 기도해야 하고, 뽑힌 사람은 ‘하나님이 공동체를 통해 나를 세우셨구나’ 하는 마음으로 한 해 동안 하나님을 알기에 힘써야 해."
    }
  ];
  // ============================================================
  // 여기까지가 매주 교체하는 블록입니다.
  // ============================================================

  var state = { step:0, solved:0, muted:true };
  var audioCtx = null;

  function $(id){ return document.getElementById(id); }

  function showScreen(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
    $(id).classList.add("active");
    try{ window.scrollTo(0,0); }catch(e){}
  }

  function setProgress(){
    $("progress-label").textContent = state.step >= QUIZ.length ? "이야기 완성!" : ("장면 " + (state.step+1) + " / 4");
    $("progress-count").textContent = state.solved + " / 4";
    $("progress-bar").style.width = Math.round((state.solved/4)*100) + "%";
    $("progress-wrap").setAttribute("aria-valuenow", String(state.solved));
  }

  // ---------- sound ----------
  function ensureAudio(){
    if (!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended"){ audioCtx.resume(); }
  }
  function playTone(freq, start, dur, type){
    if (state.muted || !audioCtx) return;
    try{
      var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
      osc.type = type || "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + start);
      osc.stop(audioCtx.currentTime + start + dur + 0.02);
    }catch(e){}
  }
  function successSound(){ playTone(523,0,.12,"sine"); playTone(659,.12,.12,"sine"); playTone(784,.24,.22,"sine"); }
  function failSound(){ playTone(160,0,.18,"sawtooth"); }

  function updateSoundBtn(){
    $("sound-btn").textContent = state.muted ? "🔇" : "🔊";
    $("sound-btn").setAttribute("aria-pressed", String(!state.muted));
  }
  function loadMuted(){
    try{ state.muted = localStorage.getItem("bible_escape_muted") !== "0"; }catch(e){ state.muted = true; }
    updateSoundBtn();
  }
  function toggleMuted(){
    ensureAudio();
    state.muted = !state.muted;
    updateSoundBtn();
    try{ localStorage.setItem("bible_escape_muted", state.muted ? "1" : "0"); }catch(e){}
    if (!state.muted) successSound();
  }

  // ---------- 진행 표시 ----------
  function renderKeys(){
    var row = $("keys-row"); row.innerHTML = "";
    for (var i=0;i<QUIZ.length;i++){
      var k = document.createElement("div");
      k.className = "key" + (i < state.solved ? " got" : "");
      k.textContent = i < state.solved ? "📜" : "○";
      row.appendChild(k);
    }
  }

  // ---------- 장면 ----------
  function renderRoom(idx){
    var room = QUIZ[idx];
    $("room-art").className = "scene-art theme-" + room.theme;
    $("room-stage").textContent = "장면 " + (idx+1) + " / 4";
    $("room-emoji").textContent = room.emoji;
    $("room-tag").textContent = room.room;
    $("room-story").textContent = room.story;
    $("room-q").textContent = room.q;
    $("btn-next").style.display = "none";
    $("btn-next").textContent = (idx === QUIZ.length - 1) ? "이야기 마무리하기 →" : "다음 장면으로 →";

    var fb = $("room-feedback"); fb.className = "feedback"; fb.innerHTML = "";

    var wrap = $("room-options"); wrap.innerHTML = "";
    room.options.forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button"; b.className = "option"; b.textContent = opt.t;
      b.addEventListener("click", function(){ handleAnswer(b, opt, room); });
      wrap.appendChild(b);
    });

    renderKeys();
    setProgress();
    showScreen("screen-puzzle");
  }

  function handleAnswer(btn, opt, room){
    ensureAudio();
    var fb = $("room-feedback");
    if (opt.ok){
      successSound();
      btn.classList.add("correct");
      document.querySelectorAll("#room-options .option").forEach(function(o){ o.disabled = true; });
      fb.className = "feedback ok show";
      fb.innerHTML = "<b>좋은 선택이야! ✨ 이야기가 이어져</b><br>" + room.explain;
      $("btn-next").style.display = "block";
      state.solved++;
      setProgress();
      renderKeys();
    } else {
      failSound();
      btn.classList.add("wrong");
      setTimeout(function(){ btn.classList.remove("wrong"); }, 500);
      var result = opt.r ? ("<b>이야기가 이렇게 흘러갔어 📖</b><br>" + opt.r + "<br><br>") : "";
      fb.className = "feedback hint show";
      fb.innerHTML = result + "<b>다시 생각해볼까? 💡</b><br>" + room.hint;
    }
  }

  function nextRoom(){
    state.step++;
    if (state.step < QUIZ.length){ renderRoom(state.step); }
    else { goFinal(); }
  }

  function goFinal(){
    state.step = QUIZ.length; state.solved = QUIZ.length; setProgress();
    $("verse-box").innerHTML = VERSE_HTML;
    $("status-line").textContent = "";
    showScreen("screen-final");
  }

  function resetGame(ask){
    if (ask && state.step < QUIZ.length && state.solved > 0){
      if (!window.confirm("처음부터 다시 시작할까? 지금까지의 진행은 초기화돼.")) return;
    }
    state.step = 0; state.solved = 0;
    $("final-name").value = ""; $("final-note").value = ""; $("pastor-note").value = "";
    $("status-line").textContent = ""; $("pastor-status").textContent = "";
    renderRoom(0);
  }

  // ---------- 구글 폼으로 조용히 제출 ----------
  function nowKST(){
    try{ return new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }); }
    catch(e){ return new Date().toString(); }
  }
  function submitToSheet(from, name, content){
    var body = new URLSearchParams();
    body.append(FORM_ENTRY.name, name);
    body.append(FORM_ENTRY.from, from);
    body.append(FORM_ENTRY.content, content);
    body.append(FORM_ENTRY.sermonDate, SERMON_DATE + " 설교");
    body.append(FORM_ENTRY.submitDate, nowKST());
    return fetch(FORM_ACTION, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
  }
  async function copyText(text){
    try{
      if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
    }catch(e){}
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy"); ta.remove();
      return ok;
    }catch(e){ return false; }
  }
  function setStatus(msg){ $("status-line").textContent = msg; }

  async function shareMessage(){
    var name = $("final-name").value.trim();
    if (!name){
      setStatus("이름을 먼저 적어줘!");
      $("final-name").focus();
      return;
    }
    var note = $("final-note").value.trim();
    if (!note){
      setStatus("선생님께 전하고 싶은 말이나 기도제목을 적어주면 보내드릴게!");
      $("final-note").focus();
      return;
    }
    var btn = $("btn-share");
    btn.disabled = true;
    setStatus("보내는 중...");
    try{
      await submitToSheet("선생님", name, note);
      setStatus("✅ 선생님께 전달했어요! 확인하시고 연락 주실 거예요.");
    }catch(e){
      var ok = await copyText("[선생님께] " + name + "\n" + note);
      setStatus(ok ? "전송에 실패했어요(네트워크 확인). 대신 복사했으니 직접 전해줘 📋" : "전송에 실패했어요. 와이파이/데이터 연결을 확인하고 다시 눌러줘.");
    }
    btn.disabled = false;
  }
  async function sendToPastor(){
    var name = $("final-name").value.trim();
    if (!name){
      $("pastor-status").textContent = "위의 이름 칸에 이름을 먼저 적어줘!";
      $("final-name").focus();
      return;
    }
    var note = $("pastor-note").value.trim();
    if (!note){
      $("pastor-status").textContent = "목사님께 전하고 싶은 말이나 기도제목을 적어주면 보내드릴게!";
      $("pastor-note").focus();
      return;
    }
    var btn = $("btn-pastor-send");
    btn.disabled = true;
    $("pastor-status").textContent = "보내는 중...";
    try{
      await submitToSheet("목사님", name, note);
      $("pastor-status").textContent = "✅ 목사님께 전달했어요! 확인하시고 연락 주실 거예요.";
    }catch(e){
      var ok = await copyText("[목사님께] " + name + "\n" + note);
      $("pastor-status").textContent = ok ? "전송에 실패했어요(네트워크 확인). 대신 복사했으니 직접 전해줘 📋" : "전송에 실패했어요. 와이파이/데이터 연결을 확인하고 다시 눌러줘.";
    }
    btn.disabled = false;
  }

  // ---------- init ----------
  function init(){
    loadMuted();

    $("sound-btn").addEventListener("click", toggleMuted);
    $("restart-btn").addEventListener("click", function(){ resetGame(true); });
    $("btn-next").addEventListener("click", nextRoom);
    $("btn-share").addEventListener("click", shareMessage);
    $("btn-pastor-send").addEventListener("click", sendToPastor);

    renderRoom(0);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
